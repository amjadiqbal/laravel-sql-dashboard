  <g transform="translate(110,350)"><rect width="300" height="54" rx="12" fill="#16213A" stroke="#24324F"/><text x="18" y="23" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34D399">SELECT <tspan fill="#CBD5E1">day, count(*)</tspan></text><text x="18" y="42" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6EE7B7">FROM orders WHERE day &gt;= {since}</text></g><g transform="translate(110,414)"><rect width="300" height="70" rx="12" fill="#16213A" stroke="#24324F"/><rect x="18.0" y="38" width="29.7" height="22" rx="3" fill="#34D399"/><rect x="55.7" y="26" width="29.7" height="34" rx="3" fill="#10B981"/><rect x="93.4" y="32" width="29.7" height="28" rx="3" fill="#34D399"/><rect x="131.1" y="16" width="29.7" height="44" rx="3" fill="#10B981"/><rect x="168.9" y="22" width="29.7" height="38" rx="3" fill="#34D399"/><rect x="206.6" y="10" width="29.7" height="50" rx="3" fill="#10B981"/><rect x="244.3" y="30" width="29.7" height="30" rx="3" fill="#34D399"/><path d="M14 60 H286" stroke="#475569" stroke-width="2"/></g><g transform="translate(110,494)"><rect width="300" height="54" rx="12" fill="#16213A" stroke="#24324F"/><circle cx="22" cy="27" r="7" fill="#EF4444"/><text x="40" y="23" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#CBD5E1">Check: failed jobs &gt; 0</text><text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6EE7B7">alerted by mail and Slack</text></g>
